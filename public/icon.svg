<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Pure clean luxury white badge -->
    <linearGradient id="ziz-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ziz-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Gazelle Primary Gradient -->
    <linearGradient id="gazelle-orange" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Gazelle Depth / Far Limbs Gradient -->
    <linearGradient id="gazelle-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Emerald Green Ribbon Gradient -->
    <linearGradient id="ziz-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadows for 3D realism -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.28"/>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#ziz-bg)" stroke="url(#ziz-border)" stroke-width="8" filter="url(#soft-shadow)"/>

  <!-- Inner Subtle Inset Rim -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.9"/>

  <!-- GRAPHIC CONTENT GROUP -->
  <g id="station-ziz-graphic" transform="translate(6, -4)">
    
    <!-- 1. SECONDARY GREEN WAVE (Depth accent) -->
    <path d="M 105,392 C 165,418 245,412 318,382 C 265,398 195,404 105,392 Z" fill="#047857" opacity="0.45"/>

    <!-- 2. PRIMARY EMERALD GREEN DYNAMIC SWOOSH -->
    <path d="
      M 72,364 
      C 125,388 200,396 280,366 
      C 342,342 396,298 442,262 
      C 392,295 332,336 264,352 
      C 194,368 126,362 72,364 
      Z" 
      fill="url(#ziz-emerald)" 
      filter="url(#glow-green)"
    />

    <!-- Green Energy Sheen along the upper edge of swoosh -->
    <path d="
      M 130,377 
      C 190,380 255,360 318,332 
      C 370,308 412,278 438,264 
      C 410,280 366,312 314,335 
      C 250,363 186,381 130,377 
      Z" 
      fill="#6ee7b7" 
      opacity="0.65"
    />

    <!-- 3. FAR LEGS OF GAZELLE (Layered behind main body for anatomical depth) -->
    <!-- Far front leg reaching forward -->
    <path d="
      M 288,236 
      C 305,252 324,268 348,276 
      C 353,278 350,284 344,284 
      C 324,280 306,264 284,244 
      Z" 
      fill="url(#gazelle-dark)"
    />

    <!-- Far rear leg extending backward in sprint -->
    <path d="
      M 174,232 
      C 152,260 130,294 92,330 
      C 88,334 84,329 87,325 
      C 118,290 142,254 165,226 
      Z" 
      fill="url(#gazelle-dark)"
    />

    <!-- 4. MAIN GAZELLE BODY (In Full Leaping Flight) -->
    <g filter="url(#glow-orange)">
      <path d="
        M 276,140
        C 254,116 226,94 184,78
        C 180,76 182,72 186,73
        C 226,88 258,112 278,133
        C 284,120 295,114 298,116
        C 302,118 299,129 292,142
        C 308,148 322,158 338,172
        C 342,176 340,183 333,185
        C 322,187 310,183 302,176
        C 293,188 295,208 302,228
        C 324,238 356,246 392,242
        C 398,241 400,247 394,250
        C 362,264 328,258 302,242
        C 295,252 286,258 273,260
        C 252,262 233,254 212,245
        C 188,235 171,235 156,243
        C 136,270 117,306 72,356
        C 68,360 63,356 67,351
        C 106,300 130,256 151,226
        C 147,215 149,203 158,196
        C 162,194 165,198 162,203
        C 171,194 188,192 211,196
        C 236,200 255,196 268,178
        C 265,164 269,151 276,140
        Z" 
        fill="url(#gazelle-orange)"
      />

      <!-- Horn detail ridge / inner horn highlight -->
      <path d="
        M 272,137 
        C 248,113 218,90 178,74 
        C 174,72 176,69 180,70 
        C 222,86 254,110 272,137 
        Z" 
        fill="#ea580c"
      />

      <!-- Muzzle / eye highlights -->
      <circle cx="310" cy="165" r="4" fill="#ffffff"/>
      <circle cx="311" cy="164.5" r="2.2" fill="#7c2d12"/>
      
      <!-- Sleek anatomical flank highlight -->
      <path d="
        M 215,206 
        C 240,210 258,224 270,240 
        C 254,244 236,240 218,233 
        C 202,227 192,222 182,224 
        C 194,214 204,208 215,206 
        Z" 
        fill="#fde68a" 
        opacity="0.55"
      />

      <!-- Chest highlight for muscular 3D definition -->
      <path d="
        M 292,188 
        C 298,202 299,218 304,232 
        C 298,232 292,228 288,220 
        C 285,208 286,198 292,188 
        Z" 
        fill="#fef08a" 
        opacity="0.4"
      />
    </g>

    <!-- 5. AMBIENT ENERGY ACCENTS -->
    <!-- Fuel drop energy spark near top right -->
    <path d="
      M 398,124 
      C 398,124 382,150 382,162 
      A 16 16 0 0 0 414 162 
      C 414,150 398,124 398,124 
      Z" 
      fill="url(#gazelle-orange)"
      filter="url(#glow-orange)"
    />
    <circle cx="394" cy="158" r="3.5" fill="#ffffff" opacity="0.85"/>

    <!-- Small energetic star / sparkle -->
    <path d="M 430,195 L 433,205 L 443,208 L 433,211 L 430,221 L 427,211 L 417,208 L 427,205 Z" fill="#fbbf24" opacity="0.75"/>
  </g>
</svg>
